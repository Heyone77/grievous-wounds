name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm test
      - name: Build and verify release
        run: python scripts/build_release.py --tag "$GITHUB_REF_NAME"
      - name: Upload both assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [ "$draft" != true ]; then
              echo "Published releases are immutable; use a new version."
              exit 1
            fi
          else
            gh release create "$tag" --verify-tag --draft --title "Grievous Wounds $tag" --generate-notes
          fi
          gh release upload "$tag" output/release/module.json output/release/grievous-wounds.zip --clobber
          gh release edit "$tag" --draft=false --latest
